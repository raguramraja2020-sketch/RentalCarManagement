<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Your Car | Valparai Car Rentals</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        VALPARAI <span>CAR RENTALS</span>
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="booking.html">Booking</a>

        <a href="cars.html">Cars</a>

        <a href="contact.html">Contact</a>

        <a href="customer_login.html"
           class="login-btn">
            Customer Login
        </a>

        <a href="mechanic_login.html">
            Mechanic
        </a>

    </nav>

</header>


<section class="page-header">

    <h1>Book Your Car</h1>

    <p>
        Reserve your vehicle and start your journey
    </p>

</section>


<section class="booking-section">


    <div class="booking-container">

        <h1>
            🚗 Complete Your Booking
        </h1>


        <form class="booking-form">


            <div class="form-group">

                <label>
                    Your Name
                </label>

                <input type="text"
                       placeholder="Enter your name"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input type="tel"
                       placeholder="Enter phone number"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Select Car
                </label>

                <select required>

                    <option value="">
                        Select Car
                    </option>

                    <option>
                        Toyota Etios
                    </option>

                    <option>
                        Hyundai i10
                    </option>

                    <option>
                        Tata Indica
                    </option>

                    <option>
                        Toyota Innova
                    </option>

                    <option>
                        Maruti Omni
                    </option>

                    <option>
                        Mahindra Scorpio
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Pickup Date
                </label>

                <input type="date"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Return Date
                </label>

                <input type="date"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Pickup Location
                </label>

                <input type="text"
                       placeholder="Enter pickup location">

            </div>


            <button type="submit"
                    class="confirm-btn">

                Confirm Booking

            </button>


        </form>

    </div>

</section>


<footer>

    <div class="copyright">

        © 2026 Valparai Car Rentals.
        All Rights Reserved.

    </div>

</footer>


</body>

</html>
