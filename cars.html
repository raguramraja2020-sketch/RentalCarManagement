<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Cars</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
        }
        /* Example styling for car list */
        .car-list {
            max-width: 800px;
            margin: 0 auto;
        }
        .car {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }
        a.btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #008CBA;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px;
        }
        a.btn:hover {
            background-color: #007BB5;
        }
    </style>
</head>
<body>
    <h1>Available Cars</h1>
    <div class="car-list">
        <div class="car">
            <h2>Etios</h2>
            <p>Details about Etios</p>
        </div>
        <div class="car">
            <h2>i10</h2>
            <p>Details about i10</p>
        </div>
        <div class="car">
            <h2>Indica</h2>
            <p>Details about Indica</p>
        </div>
        <div class="car">
            <h2>Innova</h2>
            <p>Details about Innova</p>
        </div>
        <div class="car">
            <h2>Omni</h2>
            <p>Details about Omni</p>
        </div>
        <div class="car">
            <h2>Scorpio</h2>
            <p>Details about Scorpio</p>
        </div>
    </div>
    <div style="text-align: center;">
        <a href="index.html" class="btn">Back to Home</a>
    </div>
</body>
</html>
